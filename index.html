<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Student Profile Controller</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <main class="page-shell">
    <h1>Interactive Student Profile Controller</h1>

    <section class="controller-layout" aria-label="Student profile controls">
      <form id="profileForm" class="control-panel">
        <label for="nameInput">Student name</label>
        <input id="nameInput" type="text" placeholder="Enter student name" value="Maria Santos">

        <label for="programInput">Program</label>
        <select id="programInput">
          <option value="BS Information Technology">BS Information Technology</option>
          <option value="BS Computer Science">BS Computer Science</option>
          <option value="BS Information Systems">BS Information Systems</option>
        </select>

        <label for="yearInput">Year level</label>
        <select id="yearInput">
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year" selected>3rd Year</option>
          <option value="4th Year">4th Year</option>
        </select>

        <label for="statusInput">Status</label>
        <select id="statusInput">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>

        <button id="updateBtn" type="submit">Update Profile</button>
        <p id="formMessage" role="status" aria-live="polite"></p>
      </form>

      <article id="profileCard" class="profile-card active" data-student-id="2026-001" data-status="active">
        <h2 id="profileName">Maria Santos</h2>
        <p id="profileProgram">BS Information Technology</p>
        <p id="profileYear">3rd Year</p>
        <p id="profileStatus">Active</p>
        <div id="detailsPanel" class="details-panel">
          <p id="studentIdDisplay">Student ID: 2026-001</p>
        </div>
      </article>
    </section>

    <div class="actions">
      <button id="toggleDetailsBtn" type="button">Toggle Details</button>
      <button id="themeBtn" type="button">Toggle Theme</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>
  </main>
  <script src="JavaScript/app.js"></script>
</body>
</html>
